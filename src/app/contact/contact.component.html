<button class="btn btn-primary" (click)="goToDashboard()">&#8592; Back to Dashboard</button>
<div class="container">
    <h1 class="text-center">Our People</h1>
    <div *ngIf="users && users.length; else noUsers">
        <ul class="user-list">
            <li *ngFor="let user of users" class="user-item">
                <p><strong>Name:</strong> {{ user.name }}</p>
                <p><strong>Username:</strong> {{ user.username }}</p>
                <p><strong>Email:</strong> {{ user.email }}</p>
                <p><strong>Address:</strong> {{ user.address.street }}, {{ user.address.city }}, {{ user.address.zipcode }}</p>
                <p><strong>Geo:</strong> Lat: {{ user.address.geo.lat }}, Lng: {{ user.address.geo.lng }}</p>
            </li>
        </ul>
    </div>
    <ng-template #noUsers>
        <p class="text-center">No users found.</p>
    </ng-template>
</div>
